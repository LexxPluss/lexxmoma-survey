<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合言葉の変換</title>
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; background: #fff; color: #1f2933; max-width: 640px; margin: 0 auto; padding: 32px 16px; line-height: 1.8; }
    h1 { font-size: 1.3rem; color: #0068B7; }
    input { font: inherit; width: 100%; box-sizing: border-box; padding: .6em .9em; border: 1px solid #e2e7ec; border-radius: 8px; }
    pre { background: #f6f8fa; border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; word-break: break-all; font-size: .9rem; }
    button { font: inherit; background: #0068B7; color: #fff; border: none; border-radius: 999px; padding: .5em 1.4em; cursor: pointer; }
    .note { color: #5f6b76; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>合言葉の変換</h1>
  <p class="note">新しい合言葉を入れると、<code>js/config.js</code> に貼り付ける1行ができます。合言葉そのものは、どこにも送信・保存されません。</p>
  <input id="pw" type="text" placeholder="新しい合言葉" autocomplete="off">
  <p class="note">この行を <code>js/config.js</code> の <code>PASSWORD_HASH:</code> の行と置き換えてください。</p>
  <pre id="out">（合言葉を入れるとここに表示されます）</pre>
  <button id="copy" type="button">写す（コピー）</button>
  <script>
    var out = document.getElementById('out');
    document.getElementById('pw').addEventListener('input', function (e) {
      var v = e.target.value;
      if (!v) { out.textContent = '（合言葉を入れるとここに表示されます）'; return; }
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v.trim())).then(function (buf) {
        var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        out.textContent = "  PASSWORD_HASH: '" + hex + "',";
      });
    });
    document.getElementById('copy').addEventListener('click', function () {
      try { navigator.clipboard.writeText(out.textContent); this.textContent = '写しました'; } catch (e) { /* 手で選んで写す */ }
    });
  </script>
</body>
</html>
