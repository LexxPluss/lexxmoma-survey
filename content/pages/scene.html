<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工場内の使いどころ</title>
<style>
  :root { --main: #0068B7; --main-pale: #e8f1f9; --text: #1f2933; --sub: #5f6b76; --line: #e2e7ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; }
  #stage { position: relative; height: 340px; overflow: hidden; background: #eef2f5; cursor: grab; }
  #stage::before { content: '3D を読み込み中…'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; }
  #stage canvas { display: block; position: relative; }
  #detail { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }   /* 使いどころの詳しい表示 */
  #speed { position: absolute; z-index: 3; right: 8px; top: 8px; padding: 2px 10px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--sub); font-size: 12px; }
  /* 作業名：写真の上の白い太字と暗い帯（資料と同じ見せ方） */
  #name { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 10px 48px 12px; background: linear-gradient(transparent, rgba(16, 24, 32, .78) 40%); color: #fff; font-size: 18px; font-weight: 800; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }
  /* 全体のときの使いどころの札（押すとそこへ寄る） */
  .tag3d { position: absolute; z-index: 1; left: 0; top: 0; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--main); background: rgba(255,255,255,.94); color: var(--main); font: inherit; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; box-shadow: 0 1px 4px rgba(0,30,60,.15); }
  .tag3d:hover { background: var(--main); color: #fff; }
  /* 見る人の操作：寄る・引く・元に戻す */
  #zoom { position: absolute; z-index: 3; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
  #zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.94); color: var(--text); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; box-shadow: 0 1px 3px rgba(0,30,60,.12); }
  #zoom button[data-z="reset"] { font-size: 14px; }
  #zoom button:hover { border-color: var(--main); color: var(--main); }
  #hint { position: absolute; z-index: 3; left: 48px; top: 10px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--sub); font-size: 11px; pointer-events: none; }
  #list { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 2px 4px; }
  #list button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
  #list button[aria-pressed="true"] { background: var(--main); border-color: var(--main); color: #fff; font-weight: 700; }
  @media (max-width: 420px) { #stage { height: 270px; } #name { font-size: 15px; } #list button { font-size: 11px; } .tag3d { font-size: 9.5px; padding: 1px 6px; } }
  /* 全画面（右下のボタン） */
  .fs { position: absolute; z-index: 4; right: 8px; bottom: 8px; width: 34px; height: 34px; border: 0; border-radius: 8px; background: rgba(16, 24, 32, .55); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .fs:hover { background: rgba(16, 24, 32, .8); }
  .fs svg { width: 20px; height: 20px; }
  :fullscreen #stage, :fullscreen#stage, :fullscreen #stage3d, :fullscreen#stage3d { height: 100% !important; }
</style>
</head>
<body>
<div id="stage"><button type="button" class="fs" id="fs" title="全画面で見る" aria-label="全画面で見る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><iframe id="detail" title="使いどころの詳しい表示" hidden></iframe><span id="speed"></span><div id="zoom"><button type="button" data-z="in" title="寄る" aria-label="寄る">＋</button><button type="button" data-z="out" title="引く" aria-label="引く">－</button><button type="button" data-z="reset" title="元の向きに戻す" aria-label="元の向きに戻す">⟲</button></div><span id="hint"></span><div id="name"></div></div>
<div id="list"></div>
<script src="vendor/three.min.js?r128"></script>
<script src="moma-model.js?v=2"></script>
<script src="scene3d.js?v=20"></script>
<script>
  var SPEED = 2;   // 再生の速さ（実時間の何倍で見せるか）
  // 使いどころの詳しい表示（社内の検討用ビューアから作った表示）。寄ったあと、その表示に切り替える
  var DETAIL = { 4: 'supply.html?v=3&speed=' + SPEED };
  // 自動で見て回る順番と、それぞれを見せる秒数（-1 は工場全体。詳しい表示は1回分が終わるまで）
  var TOUR = [[-1, 8], [0, 12], [1, 12], [2, 12], [3, 12], [4, 70]];
  var $ = function (id) { return document.getElementById(id); };
  $('speed').textContent = SPEED + '倍速';
  var buttons = [], names = [], cur = -2, tourAt = 0, tourT = 0, detailTimer = null;

  function view(i) {                       // 表示が変わったとき（3D から呼ばれる）
    cur = i;
    $('name').textContent = i < 0 ? '工場全体：5つの使いどころ' : names[i];
    buttons.forEach(function (b, k) { b.setAttribute('aria-pressed', k - 1 === i ? 'true' : 'false'); });
    var d = $('detail');
    clearTimeout(detailTimer);
    if (!d.hidden) { d.hidden = true; d.removeAttribute('src'); }
    if (DETAIL[i]) detailTimer = setTimeout(function () { d.src = DETAIL[i]; d.hidden = false; }, 1500);   // 寄り終わってから
    tourT = 0;
    // アンケートの画面へ、どの使いどころを見せたかを知らせる（全部見てから回答へ進む案内に使う）
    try { if (i >= 0 && window.parent !== window) parent.postMessage({ type: 'usecase-view', i: i, names: names }, location.origin); } catch (e) { }
  }
  var hold = 0;                              // 見る人が操作している間は、見て回るのを止める（秒）
  var sim = window.FactoryScene ? FactoryScene($('stage'), { view: function (i) { view(i); }, user: function () { hold = 20; } }) : null;
  var touchDev = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  $('hint').textContent = touchDev ? '横にスワイプで回す・＋－で拡大' : 'ドラッグで回す・右ドラッグでずらす・クリック後ホイールで拡大';
  // ＋・－・元に戻す：詳しい表示を出しているときは、そちらの視点を動かす
  $('zoom').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var z = b.getAttribute('data-z'), d = $('detail'), w = !d.hidden && d.contentWindow;
    hold = 20;
    try {
      if (w && w.__orbit) { if (z === 'reset') w.__app.setView('side'); else w.__orbit.zoom(z === 'in' ? 0.8 : 1.25); return; }
    } catch (err) { }
    if (z === 'reset') sim.reset(); else sim.zoom(z === 'in' ? 0.8 : 1.25);
  });
  if (sim) {
    names = sim.names;
    ['工場全体'].concat(names).forEach(function (n, k) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = n;
      b.addEventListener('click', function () { go(k - 1); });
      $('list').appendChild(b); buttons.push(b);
    });
    view(-1);
  }
  function go(i) {                          // ボタンや札で選んだところから、また順に見て回る
    hold = 0;
    tourAt = Math.max(0, TOUR.findIndex(function (t) { return t[0] === i; }));
    sim.focus(i); view(i);
  }
  // 詳しい表示が1回分の手順を終えたら、次へ
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'usecase-user') hold = 20;   // 詳しい表示で視点を動かしている
    if (e.data.type === 'usecase-cycle-done' && DETAIL[cur] && hold <= 0) next();
  });
  function next() { tourAt = (tourAt + 1) % TOUR.length; go(TOUR[tourAt][0]); }

  // 画面に見えている間だけ動かす（埋め込みの中なので、親の画面での枠の位置で判断する）
  function onScreen() {
    try {
      var fe = window.frameElement;
      if (!fe) return document.visibilityState !== 'hidden';
      if (!fe.offsetParent || parent.document.visibilityState === 'hidden') return false;
      var r = fe.getBoundingClientRect();
      return r.bottom > 0 && r.top < parent.innerHeight;
    } catch (e) { return true; }
  }
  var last = null;
  function frame(now) {
    if (onScreen()) {
      if (last != null) {
        var dt = Math.min(0.1, (now - last) / 1000);
        sim.tick(dt * SPEED, dt);
        if (hold > 0) hold -= dt;
        else if ((tourT += dt) > TOUR[tourAt][1]) next();
      }
      last = now;
    } else last = null;
    requestAnimationFrame(frame);
  }
  if (sim && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) requestAnimationFrame(frame);

  // 全画面：3D の枠だけを画面いっぱいに（もう一度押すと戻る）
  (function () {
    var b = document.getElementById('fs'), box = b.parentNode;
    var on = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
    if (!(box.requestFullscreen || box.webkitRequestFullscreen)) { b.hidden = true; return; }
    b.addEventListener('click', function () {
      if (on()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
    });
    var sync = function () { var f = !!on(), t = f ? '全画面を終わる' : '全画面で見る'; b.title = t; b.setAttribute('aria-label', t);
      b.innerHTML = f ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
                      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'; };
    document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  })();
</script>
</body>
</html>
