<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使いどころのシミュレーション</title>
<style>
  :root { --main: #0068B7; --accent: #3EB370; --accent-d: #23864d; --text: #1f2933; --sub: #5f6b76; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; }
  #stage { position: relative; height: 300px; overflow: hidden; background: #eef2f5; cursor: grab; }
  #stage::before { content: '3D を読み込み中…'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; }
  #stage canvas { display: block; position: relative; }
  .chip { position: absolute; z-index: 1; padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 1.6; white-space: nowrap; }
  #count { left: 8px; top: 8px; background: var(--accent-d); color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  #speed { right: 8px; top: 8px; background: rgba(255,255,255,.85); color: var(--sub); }
  #cap { position: absolute; z-index: 1; left: 8px; right: 8px; bottom: 8px; padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,.94); border-left: 4px solid var(--main); font-size: 13px; font-weight: 700; }
  @media (max-width: 420px) { #stage { height: 240px; } #cap { font-size: 12px; } }
</style>
</head>
<body>
<div id="stage"><span class="chip" id="count"></span><span class="chip" id="speed"></span><div id="cap"></div></div>
<script src="vendor/three.min.js?r128"></script>
<script src="moma-model.js?v=1"></script>
<script src="scene3d.js?v=3"></script>
<script>
  var SPEED = 2;   // 再生の速さ（実時間の何倍で見せるか）
  var KIND = (location.search.match(/[?&]scene=(\w+)/) || [])[1] || 'supply';
  var $ = function (id) { return document.getElementById(id); };
  $('speed').textContent = SPEED + '倍速';
  var sim = window.FactoryScene ? FactoryScene($('stage'), KIND, {
    cap: function (t) { $('cap').textContent = t; },
    count: function (t) { $('count').textContent = t; }
  }) : null;

  // 画面に見えている間だけ動かす（埋め込みの中なので、親の画面での枠の位置で判断する）
  function onScreen() {
    try {
      var fe = window.frameElement;
      if (!fe) return document.visibilityState !== 'hidden';
      if (!fe.offsetParent || parent.document.visibilityState === 'hidden') return false;
      var r = fe.getBoundingClientRect();
      return r.bottom > 0 && r.top < parent.innerHeight;
    } catch (e) { return true; }
  }
  var last = null;
  function frame(now) {
    if (onScreen()) { if (last != null) sim.tick((now - last) / 1000 * SPEED); last = now; }
    else last = null;
    requestAnimationFrame(frame);
  }
  if (sim && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) requestAnimationFrame(frame);
</script>
</body>
</html>
