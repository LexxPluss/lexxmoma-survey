<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台車とアームが同時に動く</title>
<style>
  :root { --main: #0068B7; --main-pale: #e8f1f9; --accent: #3EB370; --accent-d: #23864d; --text: #1f2933; --sub: #5f6b76; --line: #e2e7ec; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px; background: #fff; color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 13px; line-height: 1.5; }
  svg { display: block; width: 100%; height: auto; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .note { margin: 0; font-size: .75rem; color: var(--sub); }
  button { font: inherit; font-size: .8rem; padding: .25em .9em; border: 1px solid var(--main); border-radius: 999px; background: #fff; color: var(--main); cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 600 290" font-family="inherit" aria-label="止まってから作業する場合と、移動しながら作業する場合の比較"></svg>
<div class="foot">
  <p class="note">動きはイメージです。実際の時間は工程や作業内容によって変わります。</p>
  <button id="replay" type="button">もう一度</button>
</div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('stage');
  var STATIONS = [170, 300, 430];      // 作業する場所（棚）の位置
  var START = 40, END = 560;
  var SPEED = 110;                     // 移動の速さ（画面上の px/秒）
  var WORK = 1.4;                      // 止まって作業する時間（秒）
  var WINDOW = 42, SLOW = 0.6;         // 同時に動く場合：棚の前後 WINDOW px は少し速度を落として作業

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  function txt(x, y, s, attrs, parent) {
    var t = el('text', Object.assign({ x: x, y: y, 'font-size': 13, fill: '#1f2933' }, attrs || {}), parent);
    t.textContent = s;
    return t;
  }

  // ---- 2つの動き方を、時刻 → 台車の位置・アームの伸び・終わった棚 に変換する ----
  function stopAndGo() {
    var seg = [], x = START, t = 0;
    STATIONS.forEach(function (s) {
      seg.push({ t0: t, t1: t + (s - x) / SPEED, x0: x, x1: s });
      t += (s - x) / SPEED; x = s;
      seg.push({ t0: t, t1: t + WORK, x0: s, x1: s, work: s });
      t += WORK;
    });
    seg.push({ t0: t, t1: t + (END - x) / SPEED, x0: x, x1: END });
    return { total: t + (END - x) / SPEED, at: function (tt) {
      for (var i = 0; i < seg.length; i++) {
        var g = seg[i];
        if (tt <= g.t1 || i === seg.length - 1) {
          var p = Math.min(1, Math.max(0, (tt - g.t0) / (g.t1 - g.t0)));
          var ext = g.work ? Math.sin(Math.PI * p) : 0;
          return { x: g.x0 + (g.x1 - g.x0) * p, ext: ext, target: g.work || null,
                   done: STATIONS.filter(function (s) { return s < g.x0 || (s === g.x0 && (!g.work || p > 0.5)); }).length };
        }
      }
    } };
  }
  function synchronized() {
    // 少しずつ時間を進めて位置を記録する（棚の近くだけ速度を落とす）
    var log = [], x = START, t = 0, dt = 1 / 120;
    while (x < END) {
      var near = STATIONS.some(function (s) { return Math.abs(x - s) < WINDOW; });
      x = Math.min(END, x + SPEED * (near ? SLOW : 1) * dt);
      t += dt;
      log.push(x);
    }
    return { total: t, at: function (tt) {
      var i = Math.min(log.length - 1, Math.max(0, Math.floor(tt / dt)));
      var px = tt <= 0 ? START : log[i];
      var ext = 0, target = null;
      STATIONS.forEach(function (s) {
        var d = Math.abs(px - s);
        if (d < WINDOW + 18) { ext = Math.max(ext, Math.min(1, (WINDOW + 18 - d) / 26)); target = s; }
      });
      return { x: px, ext: ext, target: target, done: STATIONS.filter(function (s) { return px > s; }).length };
    } };
  }

  var lanes = [
    { title: '止まってから作業', sub: '止まる → アームで作業 → また動く', y: 0, model: stopAndGo(), color: '#5f6b76' },
    { title: '台車とアームが同時に動く（LexxMoMa）', sub: '移動しながら、アームが棚に合わせて作業', y: 134, model: synchronized(), color: '#0068B7' }
  ];
  var longest = Math.max(lanes[0].model.total, lanes[1].model.total);
  var cut = Math.round((1 - lanes[1].model.total / lanes[0].model.total) * 100);

  lanes.forEach(function (L) {
    var g = el('g', { transform: 'translate(0,' + L.y + ')' });
    txt(10, 18, L.title, { 'font-size': 17, 'font-weight': 700, fill: L.color }, g);
    txt(10, 36, L.sub, { 'font-size': 13, fill: '#5f6b76' }, g);
    L.clock = txt(590, 18, '0.0 秒', { 'text-anchor': 'end', 'font-weight': 700, 'font-size': 18, fill: L.color }, g);
    el('line', { x1: 10, y1: 124, x2: 590, y2: 124, stroke: '#cbd5de', 'stroke-width': 1.5 }, g);
    L.parts = STATIONS.map(function (s) {
      el('rect', { x: s - 20, y: 56, width: 40, height: 8, rx: 2, fill: '#cbd5de' }, g);
      return el('rect', { x: s - 9, y: 44, width: 18, height: 12, rx: 2, fill: '#f0b429' }, g);
    });
    var bot = el('g', {}, g);
    el('rect', { x: -30, y: 96, width: 60, height: 20, rx: 5, fill: L.color }, bot);
    el('circle', { cx: -18, cy: 118, r: 6, fill: '#25323c' }, bot);
    el('circle', { cx: 18, cy: 118, r: 6, fill: '#25323c' }, bot);
    L.bot = bot;
    L.arm = el('polyline', { fill: 'none', stroke: '#9fb1c0', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    L.hand = el('circle', { r: 5, fill: '#56636e' }, g);
    L.badge = txt(590, 38, '', { 'text-anchor': 'end', 'font-size': 13, fill: '#23864d', 'font-weight': 700 }, g);
  });
  var summary = txt(300, 284, '', { 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#23864d' });

  function draw(t) {
    lanes.forEach(function (L) {
      var tt = Math.min(t, L.model.total), s = L.model.at(tt);
      L.bot.setAttribute('transform', 'translate(' + s.x.toFixed(1) + ',0)');
      // アームの付け根 → 肘 → 手先。伸びていないときは台車の上でたたむ
      var sx = s.x + 8, sy = 96;
      var rx = s.x + 22, ry = 78;
      var tx = s.target != null ? s.target : rx, ty = s.target != null ? 60 : ry;
      var hx = rx + (tx - rx) * s.ext, hy = ry + (ty - ry) * s.ext;
      var ex = (sx + hx) / 2 - 10, ey = Math.min(sy, hy) - 14;
      L.arm.setAttribute('points', [sx, sy, ex, ey, hx, hy].join(' '));
      L.hand.setAttribute('cx', hx); L.hand.setAttribute('cy', hy);
      L.parts.forEach(function (p, i) { p.setAttribute('fill', i < s.done ? '#3EB370' : '#f0b429'); });
      L.clock.textContent = tt.toFixed(1) + ' 秒';
      L.badge.textContent = t >= L.model.total ? '完了' : '';
    });
    summary.textContent = t >= longest ? '同じ3か所の作業が、約' + cut + '%短い時間で終わります（イメージ）' : '';
  }

  var start = null, raf = null;
  function frame(now) {
    if (start == null) start = now;
    var t = (now - start) / 1000;
    draw(t);
    if (t < longest + 2.5) raf = requestAnimationFrame(frame);
    else { start = null; raf = requestAnimationFrame(frame); }   // 少し止めてから繰り返す
  }
  function play() { if (raf) cancelAnimationFrame(raf); start = null; raf = requestAnimationFrame(frame); }
  document.getElementById('replay').addEventListener('click', play);

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) draw(longest); else play();
})();
</script>
</body>
</html>
