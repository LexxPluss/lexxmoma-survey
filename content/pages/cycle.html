<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピッキング → 移動 → プレイスの時間</title>
<style>
  :root { --main: #0068B7; --main-pale: #e8f1f9; --accent: #3EB370; --accent-d: #23864d; --text: #1f2933; --sub: #5f6b76; --line: #e2e7ec; --other: #b7c3cd; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px; background: #fff; color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 13px; line-height: 1.5; }
  #stage3d { position: relative; height: 270px; border-radius: 8px; overflow: hidden; background: #f4f7fa; }
  #stage3d::before { content: '3D を読み込み中…'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: .8rem; }
  #stage3d canvas { display: block; position: relative; }
  #stage3d .speed { position: absolute; right: 8px; top: 6px; font-size: .7rem; color: var(--sub); background: rgba(255,255,255,.85); padding: 0 6px; border-radius: 4px; z-index: 1; }
  .tag3d { position: absolute; left: 0; top: 0; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.92); border: 1px solid #b7c3cd; color: #3f5566; font-size: 10.5px; line-height: 1.4; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
  .tag3d.ours { border-color: var(--main); color: var(--main); font-weight: 700; }
  .tag3d.both { background: #fff4dc; border-color: #f0b429; color: #8a5a00; }
  .tag3d.done { background: var(--accent-d); border-color: var(--accent-d); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .kpi { padding: 6px 8px; border-radius: 8px; background: var(--main-pale); text-align: center; line-height: 1.25; }
  .kpi .l { display: block; font-size: .7rem; color: var(--sub); }
  .kpi .v { display: block; margin: 2px 0; font-size: 1.35rem; font-weight: 800; color: var(--main); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .v small { font-size: .6em; font-weight: 700; }
  .kpi .c { display: block; font-size: .68rem; color: var(--sub); }
  .kpi.win { background: #e9f6ee; }
  .kpi.win .v { color: var(--accent-d); }
  #first { position: absolute; left: 8px; top: 6px; z-index: 1; padding: 2px 10px; border-radius: 999px; background: var(--accent-d); color: #fff; font-size: .78rem; font-weight: 700; opacity: 0; transition: opacity .2s; }
  #first.on { opacity: 1; }
  td.yes { color: var(--accent-d); font-weight: 800; font-size: 1.1rem; text-align: center; }
  td.no { color: #b7c3cd; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { padding: 5px 5px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  thead th { font-size: .7rem; color: var(--sub); font-weight: 400; white-space: nowrap; }
  td.name { line-height: 1.25; }
  td.name b { display: block; font-size: .82rem; }
  td.name small { display: block; color: var(--sub); font-size: .68rem; }
  tr.ours td.name b { color: var(--main); }
  tr.ours { background: #f3f8fd; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mini { display: block; height: 5px; border-radius: 3px; background: #eef1f4; margin-top: 2px; width: 3.6em; }
  .mini i { display: block; height: 100%; border-radius: 3px; background: var(--other); }
  tr.ours .mini i { background: var(--main); }
  .na { color: var(--sub); font-size: .7rem; }
  td.time { text-align: right; font-weight: 700; }
  td.time small { display: block; font-weight: 400; font-size: .68rem; color: #b4541a; }
  tr.ours td.time { color: var(--main); }
  tr.done td.time { color: var(--accent-d); }
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; font-size: .78rem; }
  .ctrl label { display: flex; align-items: center; gap: 5px; }
  .ctrl input[type=range] { width: 110px; accent-color: var(--main); }
  .ctrl input[type=number] { font: inherit; width: 4.2em; padding: .1em .35em; border: 1px solid var(--line); border-radius: 6px; text-align: right; }
  .ctrl b { color: var(--main); }
  button { font: inherit; font-size: .78rem; padding: .15em .9em; border: 1px solid var(--main); border-radius: 999px; background: #fff; color: var(--main); cursor: pointer; margin-left: auto; }
  details { margin-top: 6px; font-size: .72rem; color: var(--sub); }
  summary { cursor: pointer; }
  details ul { margin: 4px 0 0; padding-left: 1.1em; }
  td.name .s { display: none; }
  @media (max-width: 420px) { .kpi { padding: 5px 4px; } .kpi .v { font-size: 1.05rem; } .kpi .l, .kpi .c { font-size: .62rem; } #stage3d { height: 220px; } .tag3d { font-size: 9.5px; } th, td { padding: 4px 3px; } td.name .l { display: none; } td.name .s { display: block; } }
  /* 全画面（右下のボタン） */
  .fs { position: absolute; z-index: 4; right: 8px; bottom: 8px; width: 34px; height: 34px; border: 0; border-radius: 8px; background: rgba(16, 24, 32, .55); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .fs:hover { background: rgba(16, 24, 32, .8); }
  .fs svg { width: 20px; height: 20px; }
  :fullscreen #stage, :fullscreen#stage, :fullscreen #stage3d, :fullscreen#stage3d { height: 100% !important; }
</style>
</head>
<body>
<div class="kpis" id="kpis"></div>
<div id="stage3d"><button type="button" class="fs" id="fs" title="全画面で見る" aria-label="全画面で見る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><span class="speed" id="speedV"></span><span id="first">R1 が先に完了</span></div>
<table>
  <thead><tr><th>機種</th><th>最高速度<br>m/s</th><th>加速度<br>m/s²</th><th style="text-align:center">走りながら<br>作業</th><th style="text-align:right">1回の時間</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="ctrl">
  <label>移動距離 <input id="dist" type="range" min="2" max="20" step="1" value="10"> <b id="distV"></b></label>
  <label>1日 <input id="count" type="number" min="1" step="10" value="300"> 回</label>
  <button id="play" type="button">もう一度</button>
</div>
<details>
  <summary>数値の出典と、計算の仮定</summary>
  <ul id="note"></ul>
</details>
<script src="vendor/three.min.js?r128"></script>
<script src="moma-model.js?v=2"></script>
<script src="cycle3d.js?v=11"></script>
<script>
  // ===== ここを書き換えます =====
  var ARM = {
    pick: 4.0,      // つかむ動作の時間（秒）
    place: 4.0,     // 置く動作の時間（秒）
    overlap: 1.5    // そのうち、移動と重ねられる時間（つかんだ後の引き戻し・置く前の近づけ。秒）
  };
  // v：最高速度 m/s、a：加速度 m/s²（null は公開値なし。計算には aCalc を使う）、body：3D の形
  var MODELS = [
    { name: 'LexxMoMa R1', short: 'R1', ours: true, body: 'lexx', v: 2.0, a: 1.5, sync: true, payload: '手首部 20kg' },
    { name: 'オムロン LD-90型', short: 'LD-90', body: 'ld90', v: 1.35, a: 1.0, sync: false, payload: 'ワーク 2kg程度' },
    { name: 'オムロン LD-250型', short: 'LD-250', body: 'ld250', v: 1.20, a: 0.6, sync: false, payload: 'ワーク 10kg程度' },
    { name: '明電舎 RocoMo-V', short: 'RocoMo-V', body: 'rocomo', v: 1.00, a: null, aCalc: 1.0, sync: false, payload: '手首部 20kg', vNote: '横行 0.50' }
  ];
  var NOTES = [
    '各社の公開仕様をもとに LexxPluss で整理（2026年10月時点）。R1 の加速度は最新の社内仕様値です。「―」は公開仕様で確認できないもの、「非公開」は公開値がないものです。',
    '他社の加速度は台車単体の上限設定の初期値で、アームを載せた状態での保証値ではありません。RocoMo-V は加速度の公開値がないため、計算では 1.0m/s² と仮定しています。',
    'つかむ・置くの時間はどの機種も同じとし、各 ' + ARM.pick + '秒のうち ' + ARM.overlap + '秒は移動と重ねられると仮定しています。他社機は走行とアームの同時動作が公開仕様で確認できないため、同時動作なしで計算しています。',
    'LexxMoMa の形は実機に寄せたもの、他機種は公開されている寸法・構成をもとに簡略化したもので、実際の外観とは異なります。',
    '速さ・加速度はカタログ上の上限値です。可搬重量は各社で定義が異なります。実際の運用速度は、現場の安全条件によって変わります。'
  ];
  var PLAY_SPEED = 2;   // 再生の速さ（実時間の何倍で見せるか）
  // ==============================

  var S3 = window.MomaScene ? MomaScene(document.getElementById('stage3d'), MODELS, ARM) : null;
  if (!S3) document.getElementById('stage3d').hidden = true;
  document.getElementById('speedV').textContent = PLAY_SPEED + '倍速';
  document.getElementById('note').innerHTML = NOTES.map(function (n) { return '<li>' + n + '</li>'; }).join('');

  // 距離 d を、最高速度 v・加速度 a（減速も同じ）で走る時間と、そのときの最高到達速度
  function travel(d, v, a) {
    if (d >= v * v / a) return { t: d / v + v / a, vp: v, ta: v / a };
    var vp = Math.sqrt(d * a);
    return { t: 2 * vp / a, vp: vp, ta: vp / a };
  }
  function plan(m, d) {
    var tr = travel(d, m.v, m.a != null ? m.a : m.aCalc);
    var o = m.sync ? Math.min(ARM.overlap, tr.t / 2) : 0;
    var moveStart = ARM.pick - o, moveEnd = moveStart + tr.t, placeStart = moveEnd - o;
    return { tr: tr, o: o, moveStart: moveStart, moveEnd: moveEnd, placeStart: placeStart, total: placeStart + ARM.place };
  }

  // 表：機種・最高速度・加速度（小さな棒つき）・1回の時間（再生に合わせて進む）
  var vMax = Math.max.apply(null, MODELS.map(function (m) { return m.v; }));
  var aMax = Math.max.apply(null, MODELS.map(function (m) { return m.a || 0; }));
  function cell(v, max, note) {
    if (v == null) return '<td><span class="na">非公開</span></td>';
    return '<td class="num">' + v.toFixed(2).replace(/0$/, '') + (note ? ' <span class="na">' + note + '</span>' : '') +
      '<span class="mini"><i style="width:' + (v / max * 100).toFixed(0) + '%"></i></span></td>';
  }
  var tbody = document.getElementById('rows');
  var view = MODELS.map(function (m) {
    var tr = document.createElement('tr');
    if (m.ours) tr.className = 'ours';
    tr.innerHTML = '<td class="name"><b class="l"></b><b class="s"></b></td>' + cell(m.v, vMax) + cell(m.a, aMax) +
      (m.sync ? '<td class="yes">◯</td>' : '<td class="no">―</td>') + '<td class="time num"></td>';
    tr.querySelector('b.l').textContent = m.name;
    tr.querySelector('b.s').textContent = m.short;
    tbody.appendChild(tr);
    return { m: m, tr: tr, time: tr.querySelector('.time') };
  });

  var plans, maxT;
  function build() {
    var d = Number(document.getElementById('dist').value);
    var count = Math.max(1, Number(document.getElementById('count').value) || 0);
    document.getElementById('distV').textContent = d + ' m';
    plans = MODELS.map(function (m) { return plan(m, d); });
    maxT = Math.max.apply(null, plans.map(function (p) { return p.total; }));
    // いちばん伝えたいこと：1回あたり・1日あたりにどれだけ差が出るか
    var ours = plans[0].total, gaps = plans.slice(1).map(function (p) { return p.total - ours; });
    var lo = Math.min.apply(null, gaps), hi = Math.max.apply(null, gaps);
    var mins = function (s) { return Math.round(s * count / 60); };
    var others = plans.slice(1).map(function (p) { return p.total; });
    var oLo = Math.min.apply(null, others), oHi = Math.max.apply(null, others);
    var range = function (a, b, f) { return a.toFixed(f) === b.toFixed(f) ? a.toFixed(f) : a.toFixed(f) + '〜' + b.toFixed(f); };
    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><span class="l">1回の時間（' + d + 'm）</span><span class="v">' + ours.toFixed(1) + '<small>秒</small></span>' +
        '<span class="c">他社 ' + range(oLo, oHi, 1) + '秒</span></div>' +
      '<div class="kpi win"><span class="l">運べる回数</span><span class="v">' + range(oLo / ours, oHi / ours, 1) + '<small>倍</small></span>' +
        '<span class="c">同じ時間で・他社比</span></div>' +
      '<div class="kpi win"><span class="l">1日 ' + count + '回で</span><span class="v">' + range(mins(lo), mins(hi), 0) + '<small>分</small></span>' +
        '<span class="c">短くなる</span></div>';
    view.forEach(function (r, i) {
      r.final = plans[i].total;
      r.gap = i === 0 ? '' : '<small>+' + (plans[i].total - ours).toFixed(1) + '秒</small>';
    });
    if (S3) S3.build(d, plans);
    show(raf ? 0 : Infinity);
    if (raf) play();
  }

  function show(t) {
    view.forEach(function (r) {
      var done = t >= r.final;
      r.time.innerHTML = Math.min(t, r.final).toFixed(1) + '秒' + (done ? r.gap : '');
      r.tr.classList.toggle('done', done);
    });
    document.getElementById('first').classList.toggle('on', t >= view[0].final && t < maxT + 2 * PLAY_SPEED);
    if (S3) S3.update(Math.min(t, maxT));
  }

  var raf = null;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play() {
    if (raf) cancelAnimationFrame(raf);
    var start = null;
    (function frame(now) {
      if (start == null) start = now;
      var t = Math.max(0, now - start) / 1000 * PLAY_SPEED;
      if (t > maxT + 2.5 * PLAY_SPEED) { start = now; t = 0; }   // 終わったら少し止めて、最初から繰り返す
      show(t);
      if (onScreen()) raf = requestAnimationFrame(frame);
      else { raf = null; waitVisible(); }
    })(performance.now());
  }
  // 画面に見えていないときは止めておく（アンケートの画面を重くしないため）。
  // 埋め込みの中では IntersectionObserver が正しく働かないことがあるので、親の画面での枠の位置で判断する
  function onScreen() {
    try {
      var fe = window.frameElement;
      if (!fe) return document.visibilityState !== 'hidden';
      if (!fe.offsetParent || parent.document.visibilityState === 'hidden') return false;
      var r = fe.getBoundingClientRect();
      return r.bottom > 0 && r.top < parent.innerHeight;
    } catch (e) { return true; }
  }
  var waiting = null;
  function waitVisible() {
    if (waiting) return;
    waiting = setInterval(function () {
      if (!onScreen()) return;
      clearInterval(waiting); waiting = null;
      if (!still) play();
    }, 400);
  }

  document.getElementById('dist').addEventListener('input', build);
  document.getElementById('count').addEventListener('input', build);
  document.getElementById('play').addEventListener('click', play);
  build();
  if (!still) play();

  // 全画面：3D の枠だけを画面いっぱいに（もう一度押すと戻る）
  (function () {
    var b = document.getElementById('fs'), box = b.parentNode;
    var on = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
    if (!(box.requestFullscreen || box.webkitRequestFullscreen)) { b.hidden = true; return; }
    b.addEventListener('click', function () {
      if (on()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
    });
    var sync = function () { var f = !!on(), t = f ? '全画面を終わる' : '全画面で見る'; b.title = t; b.setAttribute('aria-label', t);
      b.innerHTML = f ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
                      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'; };
    document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  })();
</script>
</body>
</html>
