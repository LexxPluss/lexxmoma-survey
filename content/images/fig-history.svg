<text x="95" y="222.0" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">パートナー企業</text>
<text x="95" y="242.0" font-size="11" fill="#5F6B76" text-anchor="middle" dominant-baseline="middle" font-weight="500">アーム・ハンドなど</text>
