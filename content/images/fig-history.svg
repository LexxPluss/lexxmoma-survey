<line x1="402" y1="168" x2="448" y2="212" stroke="#0068B7" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="452" y="46" width="172" height="84" rx="10" fill="#fff" stroke="#0068B7" stroke-width="1.5"/>
