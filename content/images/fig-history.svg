<text x="95" y="142.0" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">LexxPluss</text>
<text x="95" y="162.0" font-size="11" fill="#5F6B76" text-anchor="middle" dominant-baseline="middle" font-weight="500">移動・制御の技術</text>
<line x1="172" y1="149" x2="228" y2="150" stroke="#5F6B76" stroke-width="1.6" marker-end="url(#ar)"/>
