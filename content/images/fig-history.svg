<text x="95" y="82.0" font-size="11" fill="#5F6B76" text-anchor="middle" dominant-baseline="middle" font-weight="500">使う現場の目線</text>
<line x1="172" y1="69" x2="228" y2="124" stroke="#5F6B76" stroke-width="1.6" marker-end="url(#ar)"/>
