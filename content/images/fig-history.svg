<text x="316" y="156.0" font-size="22" fill="#0068B7" text-anchor="middle" dominant-baseline="middle" font-weight="700">約2年</text>
<text x="316" y="182.0" font-size="11" fill="#5F6B76" text-anchor="middle" dominant-baseline="middle" font-weight="500">モバイルマニピュレータ</text>
