<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B76"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0068B7"/></marker></defs>
<rect width="640" height="286" fill="#fff"/>
<rect x="14" y="160" width="196" height="90" rx="10" fill="#E8F1F9" stroke="#0068B7" stroke-width="1.5"/>
<text x="112" y="182.0" font-size="12" fill="#0068B7" text-anchor="middle" dominant-baseline="middle" font-weight="700">STEP 1</text>
<text x="112" y="207.9" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">1つの工程で</text>
<text x="112" y="228.1" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">実機評価</text>
<rect x="28" y="120" width="168" height="30" rx="15" fill="#E9F6EE" stroke="#3EB370" stroke-width="1.5"/>
<text x="112" y="135.0" font-size="11.5" fill="#23864D" text-anchor="middle" dominant-baseline="middle" font-weight="600">Q4-2〜Q4-5 の候補工程</text>
<rect x="220" y="110" width="196" height="140" rx="10" fill="#CFE2F3" stroke="#0068B7" stroke-width="1.5"/>
<text x="318" y="132.0" font-size="12" fill="#0068B7" text-anchor="middle" dominant-baseline="middle" font-weight="700">STEP 2</text>
<text x="318" y="157.9" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">同じ工場の</text>
<text x="318" y="178.1" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">似た工程へ</text>
<rect x="234" y="70" width="168" height="30" rx="15" fill="#E9F6EE" stroke="#3EB370" stroke-width="1.5"/>
<text x="318" y="85.0" font-size="11.5" fill="#23864D" text-anchor="middle" dominant-baseline="middle" font-weight="600">Q3-1 の共通仕様をそろえる</text>
<rect x="426" y="60" width="196" height="190" rx="10" fill="#B7D3EC" stroke="#0068B7" stroke-width="1.5"/>
<text x="524" y="82.0" font-size="12" fill="#0068B7" text-anchor="middle" dominant-baseline="middle" font-weight="700">STEP 3</text>
<text x="524" y="107.9" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">他の工場へ</text>
<text x="524" y="128.1" font-size="15" fill="#1F2933" text-anchor="middle" dominant-baseline="middle" font-weight="700">標準化して展開</text>
<rect x="440" y="20" width="168" height="30" rx="15" fill="#E9F6EE" stroke="#3EB370" stroke-width="1.5"/>
<text x="524" y="35.0" font-size="11.5" fill="#23864D" text-anchor="middle" dominant-baseline="middle" font-weight="600">Q3-3 の開発・Q5-1 の支援</text>
<text x="320" y="272.0" font-size="12" fill="#5F6B76" text-anchor="middle" dominant-baseline="middle" font-weight="500">今後の展開イメージ（構想）。ご回答をもとに、各段階の進め方を具体化します</text>
