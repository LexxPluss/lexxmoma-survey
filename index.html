<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexxMoMa アンケート</title>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <!-- 合言葉の入力画面 -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-box" autocomplete="off">
      <p class="brand">LexxMoMa</p>
      <h1>アンケートのご案内</h1>
      <p class="gate-note">ご案内した合言葉を入力してください。</p>
      <input id="gate-input" type="password" placeholder="合言葉" aria-label="合言葉" required>
      <button type="submit" class="btn btn-primary">入る</button>
      <p id="gate-msg" class="gate-msg" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="site-header">
      <div class="wrap header-inner">
        <p class="brand">LexxMoMa <span>アンケート</span></p>
        <span id="demo-badge" class="demo-badge" hidden>確認用のダミー表示</span>
      </div>
    </header>

    <main class="wrap">
      <!-- 上段：一般情報（content/items.md の最初の「## 」より前の部分） -->
      <section id="intro" class="intro" hidden></section>

      <div class="layout">
        <!-- 左：アンケート -->
        <section class="col col-form" aria-labelledby="form-title">
          <div class="col-head">
            <h2 id="form-title">アンケート</h2>
            <a href="#info" class="jump">活用事例を見る ↓</a>
          </div>
          <div id="form-holder" class="form-holder"></div>
        </section>

        <!-- 右：活用事例・お見せしたいこと -->
        <aside id="info" class="col col-info" aria-labelledby="info-title">
          <div class="col-head">
            <h2 id="info-title">活用事例と今後の構想</h2>
          </div>
          <!-- フォームのセクションに合わせて切り替わる（config.js の FORM_SECTIONS） -->
          <div id="section-bar" class="section-bar" hidden></div>
          <div id="vision-filter" class="chips"></div>
          <div id="vision-cards" class="cards"></div>
        </aside>
      </div>

      <!-- みんなの回答（config.js の SHOW_RESULTS が true のときだけ表示） -->
      <section id="results-area" class="results-area" hidden>
        <div class="col-head">
          <h2>みんなの回答</h2>
        </div>
        <div class="summary">
          <div class="stat"><span class="stat-label">回答数</span><span id="sum-count" class="stat-value">–</span></div>
          <div class="stat"><span class="stat-label">最後の回答</span><span id="sum-last" class="stat-value small">–</span></div>
          <div class="stat"><span class="stat-label">画面の更新</span><span id="sum-fetched" class="stat-value small">–</span></div>
          <div class="summary-actions">
            <button id="btn-refresh" class="btn btn-primary" type="button">最新に更新</button>
            <button id="btn-csv" class="btn btn-ghost" type="button" disabled>集計表を保存（CSV）</button>
            <label class="auto"><input id="auto-refresh" type="checkbox" checked> <span id="auto-label">自動で更新</span></label>
          </div>
        </div>
        <p id="results-msg" class="results-msg" role="status"></p>
        <div id="results-list" class="results-list"></div>
      </section>
    </main>

    <footer class="site-footer wrap">
      <p>LexxPluss, Inc.</p>
    </footer>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/demo-data.js?v=10"></script>
  <script src="js/content.js?v=10"></script>
  <script src="js/results.js?v=10"></script>
  <script src="js/csv.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
